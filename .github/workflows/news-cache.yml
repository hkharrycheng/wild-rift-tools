name: news-cache
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror Wild Rift news
        run: python .github/workflows/news_mirror.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-cache.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update news-cache.json [skip ci]"
            git push
          fi
