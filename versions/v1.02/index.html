<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wild Rift Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1a2332 0%, #0d1117 100%);
  padding: 16px 20px;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(90deg, #58a6ff, #bc8cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tabs {
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  overflow-x: auto;
}
.tab {
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: all 0.2s;
  background: transparent;
  border: 1px solid transparent;
  color: #8b949e;
}
.tab.active {
  background: #1f6feb;
  color: white;
  border-color: #1f6feb;
}
.tab:hover:not(.active) {
  background: #21262d;
  color: #e6edf3;
}
.content { padding: 20px; }
.page { display: none; }
.page.active { display: block; }

/* My Pool Page */
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid #30363d;
  background: #21262d;
  color: #8b949e;
  transition: all 0.2s;
}
.filter-btn.active {
  background: #1f6feb;
  color: white;
  border-color: #1f6feb;
}
.pool-group {
  margin-bottom: 24px;
}
.pool-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.pool-badge {
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 700;
}
.pool-Splus { background: linear-gradient(135deg, #f85149, #da3633); color: white; }
.pool-S { background: #f85149; color: white; }
.pool-A { background: #d29922; color: white; }
.pool-B { background: #3fb950; color: white; }
.pool-C { background: #58a6ff; color: white; }
.pool-count {
  font-size: 12px;
  background: #30363d;
  padding: 2px 8px;
  border-radius: 10px;
  color: #8b949e;
}
.champion-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.champion-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.champion-card:hover {
  border-color: #58a6ff;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(88, 166, 255, 0.2);
}
.champion-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  margin: 0 auto 8px;
  background: linear-gradient(135deg, #30363d, #21262d);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 2px solid #30363d;
}
.champion-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.champion-icon-placeholder {
  font-size: 24px;
  font-weight: 700;
  color: #58a6ff;
}
.champion-name {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
}
.champion-role {
  font-size: 11px;
  color: #8b949e;
  margin-bottom: 4px;
}
.champion-wr {
  font-size: 11px;
  color: #3fb950;
}

/* Fight Records Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 16px;
  width: 100%;
  max-width: 700px;
  max-height: 85vh;
  overflow-y: auto;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid #30363d;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: #161b22;
  z-index: 10;
}
.modal-title {
  font-size: 18px;
  font-weight: 700;
}
.modal-close {
  background: none;
  border: none;
  color: #8b949e;
  font-size: 24px;
  cursor: pointer;
  padding: 4px 8px;
}
.modal-body { padding: 16px 20px; }
.sort-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.sort-label {
  font-size: 13px;
  color: #8b949e;
}
.sort-btn {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid #30363d;
  background: #21262d;
  color: #8b949e;
  transition: all 0.2s;
}
.sort-btn.active {
  background: #1f6feb;
  color: white;
  border-color: #1f6feb;
}
.sort-arrow {
  font-size: 10px;
  margin-left: 2px;
}
.fight-item {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
}
.fight-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.fight-grade {
  font-size: 22px;
  font-weight: 700;
  color: #d29922;
}
.fight-meta {
  text-align: right;
}
.fight-line {
  font-size: 12px;
  color: #8b949e;
  background: #21262d;
  padding: 2px 8px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 4px;
}
.fight-date {
  font-size: 11px;
  color: #6e7681;
}
.fight-vs-row {
  display: flex;
  align-items: center;
  justify-content: space-around;
  margin-bottom: 10px;
  padding: 10px 0;
  border-top: 1px solid #21262d;
  border-bottom: 1px solid #21262d;
}
.fight-champ-side {
  text-align: center;
  flex: 1;
}
.fight-champ-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin: 0 auto 4px;
  background: #30363d;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 2px solid #30363d;
}
.fight-champ-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.fight-champ-icon.me { border-color: #58a6ff; }
.fight-champ-icon.opp { border-color: #f85149; }
.fight-champ-name {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 2px;
}
.fight-champ-kda {
  font-size: 14px;
  font-weight: 700;
}
.fight-champ-kda.me { color: #58a6ff; }
.fight-champ-kda.opp { color: #f85149; }
.fight-vs-text {
  font-size: 16px;
  font-weight: 700;
  color: #6e7681;
}
.fight-details {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  font-size: 12px;
}
.fight-detail {
  display: flex;
  justify-content: space-between;
}
.fight-detail-label { color: #6e7681; }
.fight-detail-value { color: #e6edf3; font-weight: 500; }
.fight-link {
  margin-top: 10px;
  font-size: 12px;
}
.fight-link a {
  color: #58a6ff;
  text-decoration: none;
}
.fight-link a:hover { text-decoration: underline; }
.no-fights {
  text-align: center;
  color: #8b949e;
  padding: 40px 20px;
}

/* Battle Assistant Page */
.assistant-container {
  max-width: 600px;
  margin: 0 auto;
}
.selector-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  margin-bottom: 20px;
}
.selector-group {
  flex: 1;
}
.selector-vs {
  font-size: 18px;
  font-weight: 700;
  color: #6e7681;
  padding-bottom: 12px;
}
.selector-label {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #8b949e;
}
.champion-select {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #30363d;
  background: #0d1117;
  color: #e6edf3;
  font-size: 15px;
  cursor: pointer;
}
.champion-select:focus {

}
.champion-select option {
  background: #161b22;

}
.matchup-result {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;

  margin-top: 20px;
}
.matchup-type {
  font-size: 24px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 12px;
}
.matchup-type.hard-counter { color: #f85149; }
.matchup-type.soft-counter { color: #d29922; }
.matchup-type.even { color: #3fb950; }
.matchup-type.farm { color: #58a6ff; }
.matchup-edge {
  text-align: center;
  font-size: 14px;
  color: #8b949e;
  margin-bottom: 16px;
}
.no-matchup {
  text-align: center;
  padding: 20px;
  background: #0d1117;
  border-radius: 8px;
  margin-bottom: 16px;
}
.no-matchup-text {
  font-size: 14px;
  color: #d29922;
  margin-bottom: 4px;
}
.no-matchup-hint {
  font-size: 12px;
  color: #6e7681;
}
.matchup-source {
  margin-top: 12px;
  text-align: center;
}
.matchup-source a {
  color: #58a6ff;
  font-size: 12px;
  text-decoration: none;
}
.matchup-source a:hover {

}
.matchup-vs {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-bottom: 16px;
}
.matchup-champ {
  text-align: center;
}
.matchup-champ-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #30363d;
  margin: 0 auto 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  overflow: hidden;
  border: 2px solid #30363d;
}
.matchup-champ-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.matchup-champ-icon.me { border-color: #58a6ff; }
.matchup-champ-icon.opp { border-color: #f85149; }
.matchup-champ-name {
  font-size: 14px;
  font-weight: 600;
}
.matchup-vs-text {
  font-size: 18px;

  color: #8b949e;
}
.matchup-guide {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #30363d;
}
.matchup-guide-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  color: #bc8cff;
}
.matchup-guide-item {
  margin-bottom: 10px;
  padding: 8px 12px;
  background: #0d1117;
  border-radius: 8px;
  border-left: 3px solid #30363d;
}
.matchup-guide-item.summary { border-left-color: #58a6ff; }
.matchup-guide-item.howto { border-left-color: #3fb950; }
.matchup-guide-item.lane { border-left-color: #d29922; }
.matchup-guide-item.why { border-left-color: #f85149; }
.matchup-guide-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 4px;
  color: #8b949e;
}
.matchup-guide-text {
  font-size: 13px;
  color: #e6edf3;
  line-height: 1.5;
}
.personal-records {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #30363d;
}
.records-side {
  background: #0d1117;
  border-radius: 10px;
  padding: 12px;
  border: 1px solid #30363d;
  margin-bottom: 12px;
}
.records-side:last-child { margin-bottom: 0; }
.records-side.me { border-top: 3px solid #58a6ff; }
.records-side.opp { border-top: 3px solid #f85149; }
.records-side-title {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #8b949e;
  text-align: center;
}
.records-stats {
  display: flex;
  justify-content: space-around;
  margin-bottom: 8px;
}
.records-stat {
  text-align: center;
}
.records-stat-value {
  font-size: 18px;
  font-weight: 700;
}
.records-stat-label {
  font-size: 10px;
  color: #6e7681;
}
.records-vs {
  display: flex;
  align-items: center;
  font-size: 14px;
  font-weight: 700;
  color: #6e7681;
}
.win { color: #3fb950; }
.loss { color: #f85149; }
.record-mini {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  background: #0d1117;
  border-radius: 6px;
  margin-bottom: 4px;
  font-size: 12px;
}
.record-mini > span {
  flex: 1;
  text-align: center;
  min-width: 0;
}
.record-mini > span:first-child {
  text-align: left;
}
.record-mini > span:last-child {
  text-align: right;
}
.record-mini-grade {
  font-weight: 700;
  color: #d29922;
}
.record-mini-opp {
  color: #f85149;
}
.loading {
  text-align: center;
  padding: 40px;
  color: #8b949e;
}
.footer {
  text-align: center;
  padding: 20px;
  color: #484f58;
  font-size: 12px;
  border-top: 1px solid #21262d;
  margin-top: 40px;

</style>
</head>
<body>

<div class="header">
  <img src="logo.jpg" alt="HIS Tools" style="width:34px;height:34px;border-radius:8px;object-fit:contain;flex-shrink:0">
  <h1>Wild Rift Tools</h1>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('assistant', this)">🤖 Battle Assistant</div>
  <div class="tab" onclick="switchTab('pool', this)">🎯 My Pool</div>
</div>

<div class="content">
  <div id="page-assistant" class="page active">
    <div class="assistant-container">
      <div class="selector-row">
        <div class="selector-group">
          <div class="selector-label">🎮 我用緊</div>
          <select class="champion-select" id="my-champion" onchange="checkMatchup()">
            <option value="">選擇...</option>
          </select>
        </div>
        <div class="selector-vs">VS</div>
        <div class="selector-group">
          <div class="selector-label">⚔️ 對手</div>
          <select class="champion-select" id="opponent-champion" onchange="checkMatchup()">
            <option value="">選擇...</option>
          </select>
        </div>
      </div>
      <div id="matchup-result"></div>
    </div>
  </div>

  <div id="page-pool" class="page">
    <div class="filters" id="pool-filters"></div>
    <div id="champion-container"></div>
  </div>
</div>

<div class="modal-overlay" id="fight-modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Fight Records</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="footer">Wild Rift Tools © 2026.1.02</div>

<script>
let champions = [];
let fights = [];
let matchups = [];
let currentPoolFilter = 'all';
let currentSort = 'date';
let sortDirection = 'desc';
let currentChampion = '';

async function loadData() {
  try {
    const [champRes, fightRes, matchupRes] = await Promise.all([
      fetch('champions.json'),
      fetch('fights.json'),
      fetch('matchups.json')
    ]);
    champions = await champRes.json();
    fights = await fightRes.json();
    matchups = await matchupRes.json();
    initPoolPage();
    initAssistantPage();
  } catch (err) {
    console.error('載入數據失敗:', err);
    document.getElementById('champion-container').innerHTML = '<div class="loading">載入中...</div>';
  }
}

function getChampionImage(name) {
  const champ = champions.find(c => c.name === name);
  return champ ? champ.image : '';
}

function getChampIconHtml(name, side='') {
  const img = getChampionImage(name);
  const initial = name ? name.charAt(0) : '?';
  if (img) {
    return `<div class="fight-champ-icon ${side}"><img src="${img}" alt="${name}" data-champ="${name}" class="fight-champ-img"></div>`;
  }
  return `<div class="fight-champ-icon ${side}">${initial}</div>`;
}

// My Pool Page
function initPoolPage() {
  const pools = [...new Set(champions.map(c => c.myPool).filter(p => p))];
  const poolOrder = ['S+', 'S', 'A', 'B', 'C'];
  const sortedPools = poolOrder.filter(p => pools.includes(p)).concat(pools.filter(p => !poolOrder.includes(p)));
  const filtersHtml = '<button class="filter-btn active" onclick="filterPool(\'all\')">全部</button>' +
    sortedPools.map(p => `<button class="filter-btn" onclick="filterPool('${p}')">${p}</button>`).join('');
  document.getElementById('pool-filters').innerHTML = filtersHtml;
  renderChampions();
}

function filterPool(pool) {
  currentPoolFilter = pool;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === pool || (pool === 'all' && btn.textContent === '全部'));
  });
  renderChampions();
}

function getPoolClass(pool) {
  if (pool === 'S+') return 'pool-Splus';
  return 'pool-' + pool.charAt(0);
}

function renderChampions() {
  const container = document.getElementById('champion-container');
  const filtered = currentPoolFilter === 'all' 
    ? champions 
    : champions.filter(c => c.myPool === currentPoolFilter);
  
  const poolOrder = ['S+', 'S', 'A', 'B', 'C'];
  const pools = [...new Set(filtered.map(c => c.myPool).filter(p => p))];
  const sortedPools = poolOrder.filter(p => pools.includes(p)).concat(pools.filter(p => !poolOrder.includes(p)));
  
  let html = '';
  sortedPools.forEach(pool => {
    const poolChamps = filtered.filter(c => c.myPool === pool);
    html += `<div class="pool-group">
      <div class="pool-title">
        <span class="pool-badge ${getPoolClass(pool)}">${pool}</span>
        <span class="pool-count">${poolChamps.length} 個</span>
      </div>
      <div class="champion-grid">`;
    poolChamps.forEach(champ => {
      const wr = champ.winRate ? (champ.winRate * 100).toFixed(1) + '%' : 'N/A';
      const imgHtml = champ.image 
        ? `<img src="${champ.image}" alt="${champ.name}" data-champ="${champ.name}" class="champ-img">`
        : `<span class="champion-icon-placeholder">${champ.name.charAt(0)}</span>`;
      html += `<div class="champion-card" onclick="showFights('${champ.name}')">
        <div class="champion-icon">${imgHtml}</div>
        <div class="champion-name">${champ.name}</div>
        <div class="champion-role">${champ.role || 'N/A'}</div>
        <div class="champion-wr">WR: ${wr}</div>
      </div>`;
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
  
  // 處理圖片加載失敗
  container.querySelectorAll('.champ-img').forEach(img => {
    img.onerror = function() {
      const champName = this.getAttribute('data-champ');
      this.outerHTML = `<span class="champion-icon-placeholder">${champName ? champName.charAt(0) : '?'}</span>`;
    };
  });
}

// Fight Records
function showFights(champName) {
  currentChampion = champName;
  const champFights = fights.filter(f => f.champion === champName);
  document.getElementById('modal-title').textContent = `${champName} - Fight Records (${champFights.length})`;
  
  if (champFights.length === 0) {
    document.getElementById('modal-body').innerHTML = '<div class="no-fights">暫無戰績記錄</div>';
    document.getElementById('fight-modal').classList.add('active');
    return;
  }
  renderFightList(champFights);
  document.getElementById('fight-modal').classList.add('active');
}

function sortFights(fightsList, sortBy, direction) {
  const sorted = [...fightsList];
  const dir = direction === 'desc' ? -1 : 1;
  switch(sortBy) {
    case 'date':
      sorted.sort((a, b) => dir * ((b.fightDate || 0) - (a.fightDate || 0)));
      break;
    case 'season':
      sorted.sort((a, b) => dir * ((b.season || 0) - (a.season || 0)));
      break;
    case 'grade':
      const gradeOrder = {'S+': 0, 'S': 1, 'A+': 2, 'A': 3, 'B+': 4, 'B': 5, 'C+': 6, 'C': 7, 'D': 8};
      sorted.sort((a, b) => dir * ((gradeOrder[a.grade] || 99) - (gradeOrder[b.grade] || 99)));
      break;
    case 'kills':
      sorted.sort((a, b) => dir * ((b.kills || 0) - (a.kills || 0)));
      break;
  }
  return sorted;
}

function renderFightList(fightsList) {
  const sorted = sortFights(fightsList, currentSort, sortDirection);
  const arrow = sortDirection === 'desc' ? '↓' : '↑';
  
  const sortBtns = [
    {id: 'date', label: 'Fight Date'},
    {id: 'season', label: 'Season'},
    {id: 'grade', label: 'Grade'},
    {id: 'kills', label: 'Kills'}
  ].map(s => `<button class="sort-btn ${currentSort === s.id ? 'active' : ''}" onclick="changeSort('${s.id}')">${s.label}${currentSort === s.id ? `<span class="sort-arrow">${arrow}</span>` : ''}</button>`).join('');
  
  const html = `<div class="sort-bar">
    <span class="sort-label">Sort by:</span>
    ${sortBtns}
  </div>` + sorted.map(f => {
    const dateStr = f.fightDate ? new Date(f.fightDate).toLocaleDateString('zh-HK') : 'N/A';
    const myKda = `${f.kills}/${f.deaths}/${f.assists}`;
    const oppKda = `${f.opponentKills}/${f.opponentDeaths}/${f.opponentAssists}`;
    const oppName = f.opponentChampion || 'Unknown';
    
    return `<div class="fight-item">
      <div class="fight-header">
        <span class="fight-grade">${f.grade || 'N/A'}</span>
        <div class="fight-meta">
          <span class="fight-line">${f.line || 'N/A'} | S${f.season || '?'}</span>
          <div class="fight-date">${dateStr}</div>
        </div>
      </div>
      <div class="fight-vs-row">
        <div class="fight-champ-side">
          ${getChampIconHtml(f.champion, 'me')}
          <div class="fight-champ-name">${f.champion}</div>
          <div class="fight-champ-kda me">${myKda}</div>
        </div>
        <div class="fight-vs-text">VS</div>
        <div class="fight-champ-side">
          ${getChampIconHtml(oppName, 'opp')}
          <div class="fight-champ-name">${oppName}</div>
          <div class="fight-champ-kda opp">${oppKda}</div>
        </div>
      </div>
      <div class="fight-details">
        <div class="fight-detail">
          <span class="fight-detail-label">Gold</span>
          <span class="fight-detail-value">${f.goldEarned || 'N/A'}</span>
        </div>
        <div class="fight-detail">
          <span class="fight-detail-label">Damage</span>
          <span class="fight-detail-value">${f.damageDealt || 'N/A'}</span>
        </div>
        <div class="fight-detail">
          <span class="fight-detail-label">Team Fight</span>
          <span class="fight-detail-value">${f.teamFightPresence ? f.teamFightPresence + '%' : 'N/A'}</span>
        </div>
        <div class="fight-detail">
          <span class="fight-detail-label">CC Time</span>
          <span class="fight-detail-value">${f.ccDuration || 'N/A'}s</span>
        </div>
        <div class="fight-detail">
          <span class="fight-detail-label">Wards</span>
          <span class="fight-detail-value">${f.wards || 0}</span>
        </div>
        <div class="fight-detail">
          <span class="fight-detail-label">Towers</span>
          <span class="fight-detail-value">${f.towerDestroyed || 0}</span>
        </div>
        <div class="fight-detail">
          <span class="fight-detail-label">Epic Monster</span>
          <span class="fight-detail-value">${f.epicMonster || 0}</span>
        </div>
        <div class="fight-detail">
          <span class="fight-detail-label">對局類型</span>
          <span class="fight-detail-value">${f.opponentMatchupType || 'N/A'}</span>
        </div>
      </div>
      ${f.link ? `<div class="fight-link"><a href="${f.link}" target="_blank">📺 觀看影片</a></div>` : ''}
    </div>`;
  }).join('');
  
  document.getElementById('modal-body').innerHTML = html;
  
  // 處理圖片加載失敗
  document.querySelectorAll('.fight-champ-img').forEach(img => {
    img.onerror = function() {
      const champName = this.getAttribute('data-champ');
      this.outerHTML = champName ? champName.charAt(0) : '?';
    };
  });
}

function changeSort(sortBy) {
  if (currentSort === sortBy) {
    sortDirection = sortDirection === 'desc' ? 'asc' : 'desc';
  } else {
    currentSort = sortBy;
    sortDirection = 'desc';
  }
  const champFights = fights.filter(f => f.champion === currentChampion);
  renderFightList(champFights);
}

function closeModal(event) {
  if (!event || event.target.id === 'fight-modal') {
    document.getElementById('fight-modal').classList.remove('active');
  }
}

// Battle Assistant
function initAssistantPage() {
  const mySelect = document.getElementById('my-champion');
  const oppSelect = document.getElementById('opponent-champion');
  
  // 排序: S+ > S > A > B > Owned > Unowned
  const poolOrder = {'S+': 0, 'S': 1, 'A': 2, 'B': 3, 'C': 4};
  const sortedChamps = [...champions].sort((a, b) => {
    const aOrder = poolOrder[a.myPool] !== undefined ? poolOrder[a.myPool] : 5;
    const bOrder = poolOrder[b.myPool] !== undefined ? poolOrder[b.myPool] : 5;
    if (aOrder !== bOrder) return aOrder - bOrder;
    return a.name.localeCompare(b.name);
  });
  sortedChamps.forEach(c => {
    mySelect.innerHTML += `<option value="${c.name}">${c.name} (${c.myPool || 'Owned'})</option>`;
  });
  
  const allChampNames = [...new Set([
    ...champions.map(c => c.name),
    ...matchups.map(m => m.championA),
    ...matchups.map(m => m.championB)
  ])].filter(n => n).sort();
  allChampNames.forEach(name => {
    oppSelect.innerHTML += `<option value="${name}">${name}</option>`;
  });
}

function getMatchupGuide(type, edge, lane) {
  const isAdvantage = edge > 0;
  const guides = {
    'Hard Counter': {
      summary: isAdvantage ? '你係強勢Counter，前期可以主動進攻壓制對手' : '對手係強勢Counter，前期需要盡量龜塔發育，避免正面衝突',
      howto: isAdvantage ? '前期主動換血，控制兵線，利用等級優勢滾雪球。6級後可以考慮單殺或呼叫打野越塔。' : '前期以發育為主，用技能清兵，保持距離。呼叫打野幫忙gank，後期團戰先發制人。',
      lane: isAdvantage ? '推線入塔，限制對手發育，控制河道視野，搶先支援其他路。' : '龜塔發育，呼叫打野保護，避免在河道打架，等團戰再發揮。',
      why: isAdvantage ? '你的技能機制克制對手，前期傷害和換血能力佔優。' : '對手技能機制克制你，前期正面交鋒會吃虧。'
    },
    'Soft Counter': {
      summary: isAdvantage ? '你有少許優勢，可以適當進攻但唔好太進取' : '對手有少許優勢，需要小心應對，避免被滾雪球',
      howto: isAdvantage ? '穩定換血，控制兵線，尋找機會擊殺。保持視野，防止對方打野gank。' : '穩定發育，避免被換血，呼叫打野反gank。後期團戰找好輸出位置。',
      lane: isAdvantage ? '適當推線，控制視野，適時支援其他路。' : '穩定補刀，保持視野，等打野幫忙。',
      why: isAdvantage ? '你的技能範圍或傷害略佔優，但對手都有反制手段。' : '對手技能略佔優，但你都有機會反打。'
    },
    'Even': {
      summary: '實力相當，取決於操作和打野幫忙',
      howto: '專注補刀和換血技巧，保持視野。尋找對手失誤，適時呼叫打野。團戰發揮自己嘅角色作用。',
      lane: '穩定發育，控制兵線，適時支援。保持河道視野，防止被gank。',
      why: '雙方技能機制均衡，邊個操作好、視野好就贏。'
    },
    'Farm': {
      summary: '發育型對局，邊個發育好邊個贏',
      howto: '專注補刀，盡量避免打架。控制兵線，快速推線後支援其他路或刷野。',
      lane: '快速推線，然後支援其他路或刷野怪。保持視野，防止被gank。',
      why: '雙方都冇明顯克制，後期英雄需要發育時間。'
    }
  };
  return guides[type] || guides['Even'];
}

function checkMatchup() {
  const myChamp = document.getElementById('my-champion').value;
  const oppChamp = document.getElementById('opponent-champion').value;
  const resultDiv = document.getElementById('matchup-result');
  
  if (!myChamp || !oppChamp) {
    resultDiv.innerHTML = '';
    return;
  }
  
  // 優先選擇championA=我嘅記錄，唔係就用反向
  let matchup = matchups.find(m => m.championA === myChamp && m.championB === oppChamp);
  if (!matchup) {
    matchup = matchups.find(m => m.championA === oppChamp && m.championB === myChamp);
  }
  
  // 我用呢個Champion對呢個對手嘅戰績（按日期降序）
  const vsOpponentFights = fights.filter(f => f.champion === myChamp && f.opponentChampion === oppChamp)
    .sort((a, b) => new Date(b.fightDate || 0) - new Date(a.fightDate || 0));
  // 我用呢個Champion嘅全部戰績（按日期降序）
  const allChampFights = fights.filter(f => f.champion === myChamp)
    .sort((a, b) => new Date(b.fightDate || 0) - new Date(a.fightDate || 0));
  
  let typeClass = 'even';
  let typeText = 'Even';
  let edge = 0;
  let lane = 'N/A';
  let hasMatchup = false;
  if (matchup) {
    hasMatchup = true;
    const isReverse = matchup.championA === oppChamp;
    edge = isReverse ? -matchup.edge : matchup.edge;
    typeText = matchup.matchupType || 'Even';
    lane = matchup.lane || 'N/A';
    
    if (typeText.includes('Favorable') || typeText.includes('Hard Counter')) typeClass = edge > 0 ? 'farm' : 'hard-counter';
    else if (typeText.includes('Unfavorable') || typeText.includes('Soft Counter')) typeClass = edge > 0 ? 'farm' : 'soft-counter';
    else if (typeText.includes('Skill') || typeText.includes('Even')) typeClass = 'even';
    else if (typeText.includes('Farm')) typeClass = 'farm';
  }
  
  const guide = getMatchupGuide(typeText, edge, lane);
  
  const vsS = vsOpponentFights.filter(f => f.grade && ['S+', 'S'].includes(f.grade)).length;
  const vsA = vsOpponentFights.filter(f => f.grade && ['A+', 'A'].includes(f.grade)).length;
  const allS = allChampFights.filter(f => f.grade && ['S+', 'S'].includes(f.grade)).length;
  const allA = allChampFights.filter(f => f.grade && ['A+', 'A'].includes(f.grade)).length;
  
  const myImg = getChampionImage(myChamp);
  const oppImg = getChampionImage(oppChamp);
  
  resultDiv.innerHTML = `
    <div class="matchup-result">
      <div class="matchup-vs">
        <div class="matchup-champ">
          <div class="matchup-champ-icon me">${myImg ? `<img src="${myImg}" alt="${myChamp}">` : myChamp.charAt(0)}</div>
          <div class="matchup-champ-name">${myChamp}</div>
        </div>
        <div class="matchup-vs-text">VS</div>
        <div class="matchup-champ">
          <div class="matchup-champ-icon opp">${oppImg ? `<img src="${oppImg}" alt="${oppChamp}">` : oppChamp.charAt(0)}</div>
          <div class="matchup-champ-name">${oppChamp}</div>
        </div>
      </div>
      <div class="matchup-type ${typeClass}">${typeText}</div>
      <div class="matchup-edge">Lane: ${lane}</div>
      
      ${hasMatchup ? `<div class="matchup-guide">
        <div class="matchup-guide-title">📖 Matchup Guide</div>
        ${matchup.summary ? `<div class="matchup-guide-item summary">
          <div class="matchup-guide-label">Summary</div>
          <div class="matchup-guide-text">${matchup.summary}</div>
        </div>` : ''}
        ${matchup.howToPlay ? `<div class="matchup-guide-item howto">
          <div class="matchup-guide-label">How to Play</div>
          <div class="matchup-guide-text">${matchup.howToPlay}</div>
        </div>` : ''}
        ${matchup.laneImpact ? `<div class="matchup-guide-item lane">
          <div class="matchup-guide-label">Lane Impact</div>
          <div class="matchup-guide-text">${matchup.laneImpact}</div>
        </div>` : ''}
        ${matchup.why ? `<div class="matchup-guide-item why">
          <div class="matchup-guide-label">Why</div>
          <div class="matchup-guide-text">${matchup.why}</div>
        </div>` : ''}
        ${matchup.source ? `<div class="matchup-source">
          <a href="${matchup.source}" target="_blank">📖 來源: wildriftcore.com</a>
        </div>` : ''}
        ${!matchup.summary && !matchup.howToPlay ? '<div class="no-matchup-text">暫無詳細Guide數據</div>' : ''}
      </div>` : `<div class="no-matchup">
        <div class="no-matchup-text">⚠️ 暫無呢個 Matchup 數據</div>
      </div>`}
      
      <div class="personal-records">
        <div class="records-side me">
          <div class="records-side-title">📊 對 ${oppChamp} 戰績</div>
          <div class="records-stats">
            <div class="records-stat">
              <div class="records-stat-value">${vsOpponentFights.length}</div>
              <div class="records-stat-label">場數</div>
            </div>
            <div class="records-stat">
              <div class="records-stat-value win">${vsS}</div>
              <div class="records-stat-label">S</div>
            </div>
            <div class="records-stat">
              <div class="records-stat-value loss">${vsA}</div>
              <div class="records-stat-label">A</div>
            </div>
          </div>
          ${vsOpponentFights.length > 0 ? vsOpponentFights.slice(0, 2).map(f => `
            <div class="record-mini">
              <span class="record-mini-grade">${f.grade || 'N/A'}</span>
              <span>${f.kills}/${f.deaths}/${f.assists}</span>
              <span>S${f.season || '?'}</span>
            </div>
          `).join('') : '<div class="record-mini"><span>暫無對呢個對手記錄</span></div>'}
        </div>
        <div class="records-side opp">
          <div class="records-side-title">📈 ${myChamp} 最新戰績</div>
          <div class="records-stats">
            <div class="records-stat">
              <div class="records-stat-value">${allChampFights.length}</div>
              <div class="records-stat-label">總場</div>
            </div>
            <div class="records-stat">
              <div class="records-stat-value win">${allS}</div>
              <div class="records-stat-label">S</div>
            </div>
            <div class="records-stat">
              <div class="records-stat-value loss">${allA}</div>
              <div class="records-stat-label">A</div>
            </div>
          </div>
          ${allChampFights.slice(0, 5).map(f => `
            <div class="record-mini">
              <span class="record-mini-grade">${f.grade || 'N/A'}</span>
              <span>${f.kills}/${f.deaths}/${f.assists}</span>
              <span class="record-mini-opp">${f.opponentChampion || '?'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-' + tab).classList.add('active');
}

loadData();
