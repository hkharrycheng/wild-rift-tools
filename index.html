<body>
<div class="header"><img src="logo.jpg" alt="HIS Tools" style="width:34px;height:34px;border-radius:8px;object-fit:contain;flex-shrink:0"><h1>Wild Rift Tools</h1></div>
<div class="content">
  <div id="page-assistant" class="page active"><div class="assistant-container"><div class="lane-row"><div class="selector-label">🛣️ 我嘅 Lane</div><select class="champion-select" id="lane-select" onchange="onLaneChange()"><option value="">選擇 Lane...</option><option value="Top">Top</option><option value="Jungle">Jungle</option><option value="Mid">Mid</option><option value="Dragon">Dragon</option><option value="Support">Support</option></select></div><div class="selector-row"><div class="selector-group"><div class="selector-label">⚔️ This Battle</div><select class="champion-select" id="my-champion" onchange="checkMatchup()"><option value="">先選 Lane...</option></select></div><div class="selector-vs">VS</div><div class="selector-group"><div class="selector-label">💀 Enemy</div><select class="champion-select" id="opponent-champion" onchange="checkMatchup()"><option value="">先選 Lane...</option></select></div></div><div id="matchup-result"></div></div></div>
  <div id="page-pool" class="page"><div class="pool-header"><div class="filters" id="pool-filters"></div><button class="refresh-btn" onclick="refreshData('pool')" title="從雲端更新">↻ Refresh</button></div><div id="champion-container"></div></div>

  <div id="page-news" class="page"><div class="filter-bar" id="news-filters"><button class="filter-btn active" onclick="filterNews('all', this)">🔥 全部</button><button class="filter-btn" onclick="filterNews('official', this)">📢 官方</button><button class="filter-btn" onclick="filterNews('youtube', this)">▶ YouTube</button></div><div id="news-list" class="news-list"><div class="news-loading">📰 載入新聞中...</div></div></div>

<script>
let champions=[],fights=[],matchups=[],screenshots=[];
let currentPoolFilter='all',currentSort='fightDate',sortDirection='desc',currentChampion='';
let filtChamp='',filtLane='',filtType='',fightsSortTouched=false;
const WORKER='https://j07-wr-proxy.hkharrycheng.workers.dev';
async function loadData(){
  document.getElementById('champion-container').innerHTML='<div class="loading">⚔️ 載入英雄數據中...</div>';
  try{
    const useWorker=localStorage.getItem('j07_worker')!=='off';
    const [fr,cr,mr]=await Promise.all([fetch(useWorker?WORKER+'/fights':'fights.json'),fetch(useWorker?WORKER+'/champions':'champions.json'),fetch('matchups.json')]);
    fights=await fr.json();let wc=await cr.json();matchups=await mr.json();
    if(!wc||!wc.length){champions=await(await fetch('champions.json')).json();}else{champions=wc;}
    if(useWorker){fights=fights.map(f=>({...f,screenshots:(f.screenshots||[]).map(s=>WORKER+'/shot?file_token='+s.file_token)}));}

  const vs=fights.filter(f=>f.champion===mc&&f.opponentChampion===oc).sort((a,b)=>new Date(b.fightDate||0)-new Date(a.fightDate||0));
  const all=fights.filter(f=>f.champion===mc).sort((a,b)=>new Date(b.fightDate||0)-new Date(a.fightDate||0));
  let tc='even',tt='Even',edge=0,lane='N/A',hasM=false;
  if(mu){hasM=true;const rev=mu.championA===oc;edge=rev?-mu.edge:mu.edge;tt=mu.matchupType||'Even';lane=mu.lane||'N/A';if(tt.includes('Favorable')||tt.includes('Hard Counter'))tc=edge>0?'farm':'hard-counter';else if(tt.includes('Unfavorable')||tt.includes('Soft Counter'))tc=edge>0?'farm':'soft-counter';else if(tt.includes('Skill')||tt.includes('Even'))tc='even';else if(tt.includes('Farm'))tc='farm';}
  const guide=getMatchupGuide(tt,edge,lane);
  const vsS=vs.filter(f=>f.grade&&['S+','S'].includes(f.grade)).length,vsA=vs.filter(f=>f.grade&&['A+','A'].includes(f.grade)).length;
  const allS=all.filter(f=>f.grade&&['S+','S'].includes(f.grade)).length,allA=all.filter(f=>f.grade&&['A+','A'].includes(f.grade)).length;
  const mi=getChampionImage(mc),oi=getChampionImage(oc);
  r.innerHTML=`<div class="matchup-result"><div class="matchup-vs"><div class="matchup-champ"><div class="matchup-champ-icon me">${mi?`<img src="${mi}" alt="${mc}">`:mc.charAt(0)}</div><div class="matchup-champ-name">${mc}</div></div><div class="matchup-vs-text">VS</div><div class="matchup-champ"><div class="matchup-champ-icon opp">${oi?`<img src="${oi}" alt="${oc}">`:oc.charAt(0)}</div><div class="matchup-champ-name">${oc}</div></div></div><div class="matchup-type ${tc}">${tt}</div><div class="matchup-edge">Lane: ${lane}</div>${hasM?`<div class="matchup-guide"><div class="matchup-guide-title">📖 Matchup Guide</div>${mu.summary?`<div class="matchup-guide-item summary"><div class="matchup-guide-label">Summary</div><div class="matchup-guide-text">${mu.summary}</div></div>`:''}${mu.howToPlay?`<div class="matchup-guide-item howto"><div class="matchup-guide-label">How to Play</div><div class="matchup-guide-text">${mu.howToPlay}</div></div>`:''}${mu.laneImpact?`<div class="matchup-guide-item lane"><div class="matchup-guide-label">Lane Impact</div><div class="matchup-guide-text">${mu.laneImpact}</div></div>`:''}${mu.why?`<div class="matchup-guide-item why"><div class="matchup-guide-label">Why</div><div class="matchup-guide-text">${mu.why}</div></div>`:''}${mu.source?`<div class="matchup-source"><a href="${mu.source}" target="_blank">📖 來源: wildriftcore.com</a></div>`:''}${!mu.summary&&!mu.howToPlay?'<div class="no-matchup-text">暫無詳細Guide數據</div>':''}</div>`:'<div class="no-matchup"><div class="no-matchup-text">⚠️ 暫無呢個 Matchup 數據</div></div>'}<div class="personal-records"><div class="records-side me"><div class="records-side-title">📊 對 ${oc} 戰績</div><div class="records-stats"><div class="records-stat"><div class="records-stat-value">${vs.length}</div><div class="records-stat-label">場數</div></div><div class="records-stat"><div class="records-stat-value win">${vsS}</div><div class="records-stat-label">S</div></div><div class="records-stat"><div class="records-stat-value loss">${vsA}</div><div class="records-stat-label">A</div></div></div>${vs.length?vs.slice(0,5).map(f=>{const dStr=f.fightDate?new Date(f.fightDate).toLocaleDateString('zh-HK',{month:'2-digit',day:'2-digit'}):'--/--';return `<div class="record-mini"><span class="record-mini-date">${dStr}</span><span class="record-mini-grade">${f.grade||'N/A'}</span><span>${f.kills}/${f.deaths}/${f.assists}</span><span class="record-mini-opp">${f.opponentChampion||'?'}</span></div>`;}).join(''):'<div class="record-mini"><span>暫無對呢個對手記錄</span></div>'}</div><div class="records-side opp"><div class="records-side-title">📈 ${mc} 最新戰績</div><div class="records-stats"><div class="records-stat"><div class="records-stat-value">${all.length}</div><div class="records-stat-label">總場</div></div><div class="records-stat"><div class="records-stat-value win">${allS}</div><div class="records-stat-label">S</div></div><div class="records-stat"><div class="records-stat-value loss">${allA}</div><div class="records-stat-label">A</div></div></div>${all.slice(0,10).map(f=>{const dStr=f.fightDate?new Date(f.fightDate).toLocaleDateString('zh-HK',{month:'2-digit',day:'2-digit'}):'--/--';return `<div class="record-mini"><span class="record-mini-date">${dStr}</span><span class="record-mini-grade">${f.grade||'N/A'}</span><span>${f.kills}/${f.deaths}/${f.assists}</span><span class="record-mini-opp">${f.opponentChampion||'?'}</span></div>`;}).join('')}</div></div></div>`;
}
function switchTab(t,el){document.querySelectorAll('.bottom-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));el.classList.add('active');document.getElementById('page-'+t).classList.add('active');if(t==='news')loadNews();if(t==='fights')renderFightsTab();}
let newsCache={official:[],youtube:[]},newsFilter='all',newsLoaded=false;
async function loadNews(){if(newsLoaded){renderNews();return;}const l=document.getElementById('news-list');try{const r=await fetch('news-cache.json?t='+Date.now(),{cache:'no-store'});newsCache=await r.json();newsLoaded=true;}catch(e){newsCache={official:[],youtube:[],error:'無法載入新聞鏡像'};}renderNews();}
function filterNews(t,el){newsFilter=t;document.querySelectorAll('#news-filters .filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderNews();}
function renderNews(){const l=document.getElementById('news-list');if(!l)return;if(newsCache.error){l.innerHTML='<div class="news-empty">⚠️ '+newsCache.error+'<br>請稍後再試</div>';return;}const items=[];(newsCache.official||[]).forEach(n=>items.push({kind:'official',title:n.title||'',url:n.url||'#',date:String(n.published||'').slice(0,10),image:n.image||'',category:n.category||'官方'}));(newsCache.youtube||[]).forEach(v=>items.push({kind:'youtube',title:v.title||'',url:v.url||'#',date:String(v.published||'').slice(0,10),image:v.thumbnail||'',category:'影片'}));const filtered=newsFilter==='all'?items:items.filter(i=>i.kind===newsFilter);filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!filtered.length){l.innerHTML='<div class="news-empty">暫時冇新聞</div>';return;}l.innerHTML=filtered.map(i=>`<a class="news-card" href="${i.url}" target="_blank" rel="noopener"><div class="news-thumb"${i.image?' style="background-image:url(\''+i.image+'\')"':''}>${i.kind==='youtube'?'▶️':'📰'}</div><div class="news-body"><div class="news-meta"><span class="news-badge ${i.kind}">${i.kind==='youtube'?'▶ '+i.category:i.category}</span><span class="news-date">${i.date}</span></div><div class="news-title">${i.title}</div></div></a>`).join('');}
loadData();loadNews();
</script>
